<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой умный дневник</title>
    <style>
      :root {
        --bg-color: #121212;
        --card-color: #1e1e2e;
        --text-color: #f5f5f5;
        --accent-color: #89b4fa;
        --danger-color: #f38ba8;
      }

      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .container {
        background-color: var(--card-color);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        max-width: 500px;
        width: 100%;
        text-align: center;
      }

      h1 {
        color: var(--accent-color);
        margin-bottom: 20px;
        font-size: 2rem;
      }

      p.subtitle {
        color: #94a1b2;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      textarea {
        width: 100%;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #313238;
        background-color: #0f0f11;
        color: white;
        font-size: 1rem;
        resize: vertical;
        min-height: 120px;
        box-sizing: border-box;
        margin-bottom: 15px;
        outline: none;
      }

      textarea:focus {
        border-color: var(--accent-color);
      }

      .btn-group {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn-save {
        background-color: var(--accent-color);
        color: #121212;
      }

      .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(137, 180, 250, 0.4);
      }

      .btn-clear {
        background-color: var(--danger-color);
        color: white;
      }

      .btn-clear:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(243, 139, 168, 0.4);
      }

      .status {
        margin-top: 20px;
        font-size: 0.9rem;
        color: #666;
        min-height: 1.2em;
      }

      .status.success { color: var(--accent-color); }
      .status.error { color: var(--danger-color); }
    </style>
  </head>
  <body>

    <div class="container">
      <h1>📒 Мой Дневник</h1>
      <p class="subtitle">Напиши что-нибудь. Сайт запомнит это даже после перезагрузки страницы.</p>
      
      <textarea id="noteInput" placeholder="Здесь можно писать мысли, планы, идеи..."></textarea>
      
      <div class="btn-group">
        <button class="btn-save" onclick="saveNote()">Сохранить</button>
        <button class="btn-clear" onclick="clearNote()">Очистить</button>
      </div>

      <div class="status" id="statusMessage"></div>
    </div>

    <script>
      // Элементы страницы
      const noteInput = document.getElementById('noteInput');
      const statusMessage = document.getElementById('statusMessage');

      // 1. При загрузке страницы пытаемся найти сохраненный текст
      window.onload = function() {
        const savedText = localStorage.getItem('myDiaryNote');
        if (savedText) {
          noteInput.value = savedText;
          showStatus('Текст восстановлен из памяти браузера', 'success');
        } else {
          showStatus('Нет сохраненных записей', 'success');
        }
      };

      // 2. Функция сохранения (LocalStorage)
      function saveNote() {
        const text = noteInput.value;
        
        if (!text.trim()) {
          showStatus('Сначала напишите что-нибудь!', 'error');
          return;
        }

        localStorage.setItem('myDiaryNote', text);
        showStatus('✅ Сохранено! Теперь можно обновлять страницу.', 'success');
      }

      // 3. Функция очистки
      function clearNote() {
        if(confirm('Вы уверены, что хотите удалить запись?')) {
          localStorage.removeItem('myDiaryNote');
          noteInput.value = '';
          showStatus('Запись удалена', 'success');
        }
      }

      // 4. Вспомогательная функция для показа сообщений
      function showStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = 'status ' + type;
      }
    </script>
  </body>
</html>
