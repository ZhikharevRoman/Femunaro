<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Файлы Фемунаро</title>
    <style>
      :root {
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --text: #1f2937;
        --border: #e5e7eb;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text);
        margin: 0;
        padding: 20px;
        line-height: 1.6;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      h1 {
        color: var(--text);
        font-size: 2rem;
        margin: 0;
      }

      .file-card {
        background-color: var(--card-bg);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        border: 1px solid var(--border);
      }

      .file-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text);
        margin: 0 0 8px 0;
      }

      .file-desc {
        color: #6b7280;
        font-size: 0.95rem;
        margin: 0;
      }

      .file-preview {
        width: 100%;
        height: auto;
        border-radius: 12px;
        object-fit: contain;
        max-height: 300px;
        border: 1px solid var(--border);
      }

      .download-btn {
        display: inline-block;
        background-color: var(--primary);
        color: white;
        padding: 12px 24px;
        border-radius: 10px;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      .download-btn:hover {
        background-color: var(--primary-hover);
        transform: translateY(-1px);
      }

      .download-btn:active {
        transform: translateY(0);
      }

      .file-meta {
        font-size: 0.85rem;
        color: #9ca3af;
        margin-top: 8px;
        text-align: center;
      }

      @media (max-width: 600px) {
        body { padding: 15px; }
        .file-card { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Файлы Фемунаро</h1>
      </header>

      <!-- КАРТОЧКА 1: ФЛАГ -->
      <article class="file-card">
        <h2 class="file-title">Флаг Фемунаро</h2>
        <p class="file-desc">Официальный флаг проекта. Высокое качество.</p>
        <img src="Флаг Фемунаро.png" alt="Флаг Фемунаро" class="file-preview" />
        <a href="Флаг Фемунаро.png" class="download-btn" download>Скачать флаг</a>
        <div class="file-meta">Файл: Флаг Фемунаро.png</div>
      </article>

      <!-- КАРТОЧКА 2: ГЕРБ -->
      <article class="file-card">
        <h2 class="file-title">Герб Фемунаро</h2>
        <p class="file-desc">Символика и эмблема проекта.</p>
        <img src="Герб Фемунаро.png" alt="Герб Фемунаро" class="file-preview" />
        <a href="Герб Фемунаро.png" class="download-btn" download>Скачать герб</a>
        <div class="file-meta">Файл: Герб Фемунаро.png</div>
      </article>

    </div>
  </body>
</html>
